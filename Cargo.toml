[package]
name = "repos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bulk commands for multiple Git repositories"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
git2 = { version = "0.21", default-features = false, features = ["ssh"] }
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["vendored-libgit2"]
vendored-libgit2 = ["git2/vendored-libgit2"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
